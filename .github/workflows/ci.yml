name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      # No OPENROUTER_API_KEY is set anywhere in this workflow, deliberately:
      # the offline suite must pass without one (spec.md's own constraint),
      # and this is the check that actually enforces it continuously.
      - name: Run offline test suite
        run: uv run pytest -q
