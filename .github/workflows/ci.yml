name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Reads the committed .python-version (3.12) automatically.
      - name: Install dependencies
        run: uv sync

      # No OPENROUTER_API_KEY is set anywhere in this workflow, deliberately:
      # the offline suite must pass without one (spec.md's own constraint),
      # and this is the check that actually enforces it continuously.
      - name: Run offline test suite
        run: uv run pytest -q

  # The built UI is committed so installed users need no Node. This job
  # fails when web/ source changed without rebuilding src/umlregen/ui/static.
  frontend:
    name: frontend bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from web/package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install and build
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Fail if the committed bundle differs
        run: git diff --exit-code -- src/umlregen/ui/static
